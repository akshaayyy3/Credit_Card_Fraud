<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Card Fraud Risk Checker</title>
<style>
  body{font-family:Segoe UI,Arial,sans-serif;background:#f3f5f9;margin:0;padding:24px;color:#1f2937}
  .card{max-width:560px;margin:auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  h1{font-size:1.4rem;margin-top:0}
  label{display:block;margin-top:14px;font-size:.9rem;font-weight:600}
  select,input{width:100%;padding:9px;margin-top:5px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box}
  button{margin-top:22px;width:100%;padding:12px;background:#2563eb;color:#fff;border:0;border-radius:6px;font-size:1rem;cursor:pointer}
  button:hover{background:#1d4ed8}
  #result{margin-top:20px;padding:14px;border-radius:8px;display:none;font-weight:600}
  .fraud{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.err{background:#fef3c7;color:#92400e}
  small{display:block;margin-top:18px;color:#6b7280}
</style>
</head>
<body>
<div class="card">
  <h1>Credit Card Fraud Risk Checker</h1>
  <form id="form"></form>
  <div id="result"></div>
  <small>Educational demo. Model performance on this dataset is limited; see README.</small>
</div>
<script>
// [api field name, label, key in /options]
const fields = [
  ["merchant_name", "Merchant Name", "Merchant Name"],
  ["transaction_category", "Transaction Category", "Transaction Category"],
  ["merchant_location", "Merchant Location", "Merchant Location"],
  ["state", "State", "State"],
  ["bank", "Bank", "Bank"],
  ["card_type", "Card Type", "Card Type"],
];
const form = document.getElementById("form");
const result = document.getElementById("result");

async function init() {
  const opts = await (await fetch("/options")).json();
  fields.forEach(([id, label, key]) => {
    form.insertAdjacentHTML("beforeend",
      `<label>${label}<select id="${id}">${opts.categories[key].map(v => `<option>${v}</option>`).join("")}</select></label>`);
  });
  form.insertAdjacentHTML("beforeend",
    `<label>Transaction Amount (INR)<input id="transaction_amount" type="number" min="1" value="5000"></label>
     <label>Transaction Date<input id="transaction_date" type="date" value="2024-06-15"></label>
     <button type="submit">Check Transaction</button>`);
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const body = {};
  fields.forEach(([id]) => body[id] = document.getElementById(id).value);
  body.transaction_amount = parseFloat(document.getElementById("transaction_amount").value);
  body.transaction_date = document.getElementById("transaction_date").value;
  try {
    const r = await fetch("/predict", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(JSON.stringify(d.detail));
    result.className = d.prediction === "Fraud" ? "fraud" : "ok";
    result.textContent = `${d.prediction} — fraud probability ${(d.fraud_probability * 100).toFixed(1)}%`;
  } catch (err) {
    result.className = "err";
    result.textContent = "Error: " + err.message;
  }
  result.style.display = "block";
});
init();
</script>
</body>
</html>
